# ./mvnw quarkus:dev

"%dev":
    local-file:
        perustiedot: true
        toteumat: true
        co_toteumat: true

"%prod":
    palke:
        azure:
            sasToken: "token"
            accountName: "accName"
            containerName: "container"
        ftp:
            host: "${PALKE_SFTP_HOST}"
            perustiedot:
                user: "${PALKE_SFTP_USER_ID138}"
                password: "${PALKE_SFTP_PASSWORD_ID138}"
            toteumat:
                user: "${PALKE_SFTP_USER_ID025}"
                password: "${PALKE_SFTP_PASSWORD_ID025}"
            co_toteumat:
                user: "${PALKE_SFTP_USER_ID166}"
                password: "${PALKE_SFT_PASSWORD_ID166}"
    kasko:
        azure:
            sasToken: "token"
            accountName: "accName"
            containerName: "container"
        ftp:
            host: "${KASKO_SFTP_HOST}"
            perustiedot:
                user: "${KASKO_SFTP_USER_ID137}"
                password: "${KASKO_SFTP_PASSWORD_ID137}"
            toteumat:
                user: "${KASKO_SFTP_USER_ID023}"
                password: "${KASKO_SFTP_PASSWORD_ID023}"
    sotepe:
        azure:
            sasToken: "token"
            accountName: "accName"
            containerName: "container"
        ftp:
            host: "${SOTEPE_SFTP_HOST}"
            perustiedot:
                user: "${SOTEPE_SFTP_USER_ID167}"
                password: "${SOTEPE_SFTP_PASSWORD_ID167}"
            toteumat:
                user: "${SOTEPE_SFTP_USER_ID022}"
                password: "${SOTEPE_SFTP_PASSWORD_ID022}"