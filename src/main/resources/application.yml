# ./mvnw quarkus:dev

# db configs need to be in application.properties

"%dev":
    local-file:
        perustiedot: true
        toteumat: true
        co_toteumat: true
        s4_toteumat: true

"%prod":
    dev:
        ftp-upload:
            enabled: "${DEV_FTP_UPLOAD_ENABLED}"
    palke:
        azure:
            sasToken: "${PALKE_SAS_TOKEN}"
            accountName: "${PALKE_AZURE_ACCOUNT}"
            containerName: "${PALKE_AZURE_CONTAINER}"
            directory: "${AZURE_DIRECTORY}"
        ftp:
            host: "${PALKE_SFTP_HOST}"
            passiveMode: "${PALKE_SFTP_PASSIVE_MODE:true}"
            perustiedot:
                user: "${PALKE_SFTP_USER_ID138}"
                password: "${PALKE_SFTP_PASSWORD_ID138}"
            toteumat:
                user: "${PALKE_SFTP_USER_ID025}"
                password: "${PALKE_SFTP_PASSWORD_ID025}"
            co_toteumat:
                user: "${PALKE_SFTP_USER_ID166}"
                password: "${PALKE_SFTP_PASSWORD_ID166}"
        s4_sftp:
            host: "${PALKE_S4_SFTP_HOST}"
            passiveMode: "${PALKE_S4_SFTP_PASSIVE_MODE:true}"
            perustiedot:
                user: "${PALKE_S4_SFTP_USER_PERUSTIEDOT}"
                password: "${PALKE_S4_SFTP_PASSWORD_PERUSTIEDOT}"
            toteumat:
                user: "${PALKE_S4_SFTP_USER_TOTEUMAT}"
                password: "${PALKE_S4_SFTP_PASSWORD_TOTEUMAT}"
    kasko:
        azure:
            sasToken: "${KASKO_SAS_TOKEN}"
            accountName: "${KASKO_AZURE_ACCOUNT}"
            containerName: "${KASKO_AZURE_CONTAINER}"
            directory: "${AZURE_DIRECTORY}"
        ftp:
            host: "${KASKO_SFTP_HOST}"
            passiveMode: "${KASKO_SFTP_PASSIVE_MODE:true}"
            perustiedot:
                user: "${KASKO_SFTP_USER_ID137}"
                password: "${KASKO_SFTP_PASSWORD_ID137}"
            toteumat:
                user: "${KASKO_SFTP_USER_ID023}"
                password: "${KASKO_SFTP_PASSWORD_ID023}"
        s4_sftp:
            host: "${KASKO_S4_SFTP_HOST}"
            passiveMode: "${KASKO_S4_SFTP_PASSIVE_MODE:true}"
            perustiedot:
                user: "${KASKO_S4_SFTP_USER_PERUSTIEDOT}"
                password: "${KASKO_S4_SFTP_PASSWORD_PERUSTIEDOT}"
            toteumat:
                user: "${KASKO_S4_SFTP_USER_TOTEUMAT}"
                password: "${KASKO_S4_SFTP_PASSWORD_TOTEUMAT}"
    sotepe:
        azure:
            sasToken: "${SOTEPE_SAS_TOKEN}"
            accountName: "${SOTEPE_AZURE_ACCOUNT}"
            containerName: "${SOTEPE_AZURE_CONTAINER}"
            directory: "${AZURE_DIRECTORY}"
        ftp:
            host: "${SOTEPE_SFTP_HOST}"
            passiveMode: "${SOTEPE_SFTP_PASSIVE_MODE:true}"
            perustiedot:
                user: "${SOTEPE_SFTP_USER_ID167}"
                password: "${SOTEPE_SFTP_PASSWORD_ID167}"
            toteumat:
                user: "${SOTEPE_SFTP_USER_ID022}"
                password: "${SOTEPE_SFTP_PASSWORD_ID022}"
        s4_sftp:
            host: "${SOTEPE_S4_SFTP_HOST}"
            passiveMode: "${SOTEPE_S4_SFTP_PASSIVE_MODE:true}"
            perustiedot:
                user: "${SOTEPE_S4_SFTP_USER_PERUSTIEDOT}"
                password: "${SOTEPE_S4_SFTP_PASSWORD_PERUSTIEDOT}"
            toteumat:
                user: "${SOTEPE_S4_SFTP_USER_TOTEUMAT}"
                password: "${SOTEPE_S4_SFTP_PASSWORD_TOTEUMAT}"